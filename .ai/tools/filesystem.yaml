{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Tool",
  "metadata": {"name": "filesystem", "version": "1.1.0", "description": "Trusted Context Builder reads and plan-scoped writes inside the execution workspace."},
  "spec": {
    "category": "execution", "capabilities": ["filesystem.read", "filesystem.write"],
    "inputSchema": {"type": "object", "oneOf": [{"additionalProperties": false, "required": ["operation", "path"], "properties": {"operation": {"const": "read"}, "path": {"type": "string", "minLength": 1}}}, {"additionalProperties": false, "required": ["operation", "path", "content"], "properties": {"operation": {"enum": ["write", "compare_write"]}, "path": {"type": "string", "minLength": 1}, "content": {"type": "string"}, "expectedExists": {"type": "boolean"}, "expectedSha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"}}}]},
    "outputSchema": {"type": "object"},
    "permissions": ["workspace:read", "workspace:write"], "timeoutMs": 5000,
    "retryPolicy": {"maxAttempts": 1}
  }
}
