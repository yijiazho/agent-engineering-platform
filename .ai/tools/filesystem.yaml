{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Tool",
  "metadata": {"name": "filesystem", "version": "1.4.0", "description": "Bounded trusted reads and atomic, handle-confined plan-scoped compare-and-write operations inside the execution workspace."},
  "spec": {
    "category": "execution", "capabilities": ["filesystem.read", "filesystem.write"],
    "inputSchema": {"type": "object", "oneOf": [{"additionalProperties": false, "required": ["operation", "path"], "properties": {"operation": {"const": "read"}, "path": {"type": "string", "minLength": 1}, "maxBytes": {"type": "integer", "minimum": 1}}}, {"additionalProperties": false, "required": ["operation", "path", "content"], "properties": {"operation": {"const": "write"}, "path": {"type": "string", "minLength": 1}, "content": {"type": "string"}}}, {"additionalProperties": false, "required": ["operation", "path", "content", "expectedExists", "expectedSha256"], "properties": {"operation": {"const": "compare_write"}, "path": {"type": "string", "minLength": 1}, "content": {"type": "string"}, "expectedExists": {"type": "boolean"}, "expectedSha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"}, "mode": {"type": "integer", "minimum": 0, "maximum": 4095}}}, {"additionalProperties": false, "required": ["operation", "path", "expectedExists", "expectedSha256"], "properties": {"operation": {"const": "compare_delete"}, "path": {"type": "string", "minLength": 1}, "expectedExists": {"const": true}, "expectedSha256": {"type": "string", "pattern": "^[0-9a-f]{64}$"}}}]},
    "outputSchema": {"type": "object"},
    "permissions": ["workspace:read", "workspace:write"], "timeoutMs": 5000,
    "retryPolicy": {"maxAttempts": 1}
  }
}
