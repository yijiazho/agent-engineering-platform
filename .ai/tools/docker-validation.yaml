{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Tool",
  "metadata": {"name": "docker-validation", "version": "1.1.0", "description": "Network-disabled build and test execution in a bounded container with image readiness evidence."},
  "spec": {
    "category": "execution", "capabilities": ["docker.run"],
    "inputSchema": {"type": "object", "additionalProperties": false, "required": ["image", "requiredExecutables", "commands", "workspaceMount", "resources"], "properties": {"image": {"type": "string", "pattern": "^[A-Za-z0-9._/-]+@sha256:[0-9a-f]{64}$"}, "requiredExecutables": {"type": "array", "minItems": 1, "items": {"type": "object", "additionalProperties": false, "required": ["argv", "versionPattern"], "properties": {"argv": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}}, "versionPattern": {"type": "string", "minLength": 1, "maxLength": 200}}}}, "commands": {"type": "array", "minItems": 1, "items": {"type": "object", "additionalProperties": false, "required": ["argv"], "properties": {"argv": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}}}}}, "workspaceMount": {"type": "object", "additionalProperties": false, "required": ["hostPath", "containerPath", "readOnly"], "properties": {"hostPath": {"type": "string", "minLength": 1}, "containerPath": {"type": "string", "minLength": 1}, "readOnly": {"type": "boolean"}}}, "resources": {"type": "object", "additionalProperties": false, "required": ["cpuLimit", "memoryBytes"], "properties": {"cpuLimit": {"type": "number", "exclusiveMinimum": 0}, "memoryBytes": {"type": "integer", "minimum": 1}}}}},
    "outputSchema": {"type": "object", "additionalProperties": false, "required": ["image", "workspaceMount", "readiness", "commands"], "properties": {"image": {"type": "string", "minLength": 1}, "workspaceMount": {"type": "object"}, "readiness": {"type": "object", "additionalProperties": false, "required": ["status", "executables"], "properties": {"status": {"enum": ["PASS", "INCOMPLETE"]}, "executables": {"type": "array", "minItems": 0}}}, "commands": {"type": "array"}}},
    "permissions": ["network:none", "workspace:write"], "timeoutMs": 600000,
    "retryPolicy": {"maxAttempts": 2, "backoffMs": 1000}
  }
}
