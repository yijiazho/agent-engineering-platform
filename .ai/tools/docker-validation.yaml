{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Tool",
  "metadata": {"name": "docker-validation", "version": "1.0.0", "description": "Network-disabled build and test execution in a bounded container."},
  "spec": {
    "category": "execution", "capabilities": ["docker.run"],
    "inputSchema": {"type": "object", "additionalProperties": false, "required": ["image", "commands", "workspaceMount", "resources"], "properties": {"image": {"type": "string", "minLength": 1}, "commands": {"type": "array", "minItems": 2}, "workspaceMount": {"type": "object"}, "resources": {"type": "object"}}},
    "outputSchema": {"type": "object"},
    "permissions": ["network:none", "workspace:write"], "timeoutMs": 600000,
    "retryPolicy": {"maxAttempts": 2, "backoffMs": 1000}
  }
}
