{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Agent",
  "metadata": {"name": "code-generator", "version": "1.0.1"},
  "spec": {
    "role": "Code Generator",
    "promptRef": {"kind": "Prompt", "name": "patch-generation", "version": "1.0.0"},
    "modelRef": {"kind": "Model", "name": "default-reasoning", "version": "1.0.1"},
    "toolRefs": [
      {"kind": "Tool", "name": "filesystem", "version": "1.0.0"},
      {"kind": "Tool", "name": "git", "version": "1.0.0"}
    ],
    "policyRefs": [
      {"kind": "Policy", "name": "agent-safety", "version": "1.0.0"},
      {"kind": "Policy", "name": "workspace-write", "version": "1.0.0"}
    ],
    "outputSchema": {"type": "object", "additionalProperties": false, "required": ["changes"], "properties": {"changes": {"type": "array", "minItems": 1, "items": {"type": "object", "additionalProperties": false, "required": ["path", "content"], "properties": {"path": {"type": "string", "minLength": 1}, "content": {"type": "string"}}}}}}
  }
}
