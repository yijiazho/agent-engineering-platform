{
    "apiVersion":  "aep.dev/v1alpha1",
    "kind":  "Agent",
    "metadata":  {
                     "name":  "issue-analyzer",
                     "version":  "1.9.0"
                 },
    "spec":  {
                 "role":  "Issue Analyzer",
                 "promptRef":  {
                                   "kind":  "Prompt",
                                   "name":  "issue-analysis",
                                   "version":  "1.7.0"
                               },
                 "modelRef":  {
                                  "kind":  "Model",
                                  "name":  "default-reasoning",
                                  "version":  "1.1.0"
                              },
                 "policyRefs":  [
                                    {
                                        "kind":  "Policy",
                                        "name":  "agent-safety",
                                        "version":  "1.0.0"
                                    }
                                ],
                 "outputSchema":  {
                                      "type":  "object",
                                      "additionalProperties":  false,
                                      "required":  [
                                                       "requestedChange",
                                                       "acceptanceCriteria",
                                                       "acceptanceCriterionInsertions",
                                                       "evaluatorRequirements",
                                                       "risks",
                                                       "likelyRepositoryAreas",
                                                       "planningPredicates"
                                                   ],
                                      "properties":  {
                                                         "requestedChange":  {
                                                                                 "type":  "string",
                                                                                 "minLength":  1
                                                                             },
                                                         "acceptanceCriteria":  {
                                                                                    "type":  "array",
                                                                                    "minItems":  1,
                                                                                    "items":  {"type": "object", "additionalProperties": false,
                                                                                                  "required": ["id", "text"], "properties": {
                                                                                                    "id": {"type": "string", "minLength": 1},
                                                                                                    "text": {"type": "string", "minLength": 1}}}
                                                                                },
                                                         "acceptanceCriterionInsertions":  {
                                                                                               "type":  "array",
                                                                                               "minItems":  1,
                                                                                               "uniqueItems":  true,
                                                                                               "items":  {
                                                                                                             "type":  "object",
                                                                                                             "additionalProperties":  false,
                                                                                                             "required":  [
                                                                                                                              "criterionId",
                                                                                                                              "requiredInsertions"
                                                                                                                          ],
                                                                                                             "properties":  {
                                                                                                                                "criterionId":  {
                                                                                                                                                  "type":  "string",
                                                                                                                                                  "minLength":  1
                                                                                                                                              },
                                                                                                                                "requiredInsertions":  {
                                                                                                                                                           "type":  "array",
                                                                                                                                                           "uniqueItems":  true,
                                                                                                                                                           "items":  {
                                                                                                                                                                         "type":  "object",
                                                                                                                                                                         "additionalProperties":  false,
                                                                                                                                                                         "required":  [
                                                                                                                                                                                          "path",
                                                                                                                                                                                          "value"
                                                                                                                                                                                      ],
                                                                                                                                                                         "properties":  {
                                                                                                                                                                                            "path":  {
                                                                                                                                                                                                         "type":  "string",
                                                                                                                                                                                                         "minLength":  1
                                                                                                                                                                                                     },
                                                                                                                                                                                            "value":  {
                                                                                                                                                                                                          "type":  "string",
                                                                                                                                                                                                          "minLength":  1
                                                                                                                                                                                                      }
                                                                                                                                                                                        }
                                                                                                                                                                     }
                                                                                                                                                       }
                                                                                                                            }
                                                                                                         }
                                                                                           },
                                                         "evaluatorRequirements":  {
                                                                                       "type":  "array",
                                                                                       "items":  {
                                                                                                     "type":  "object",
                                                                                                     "additionalProperties":  false,
                                                                                                     "required":  [
                                                                                                                      "criterionId",
                                                                                                                      "path",
                                                                                                                      "owner",
                                                                                                                      "requirementId",
                                                                                                                      "selectionReason"
                                                                                                                  ],
                                                                                                     "properties":  {
                                                                                                                        "criterionId":  {
                                                                                                                                          "type":  "string",
                                                                                                                                          "minLength":  1
                                                                                                                                      },
                                                                                                                        "path":  {
                                                                                                                                     "type":  "string",
                                                                                                                                     "minLength":  1
                                                                                                                                 },
                                                                                                                        "owner":  {
                                                                                                                                      "type":  "string",
                                                                                                                                      "enum":  [
                                                                                                                                                   "PATCH_EVALUATION"
                                                                                                                                               ]
                                                                                                                                  },
                                                                                                                        "requirementId":  {
                                                                                                                                              "type":  "string",
                                                                                                                                              "enum":  [
                                                                                                                                                           "DIFF_CHECK_PASSES"
                                                                                                                                                       ]
                                                                                                                                          },
                                                                                                                        "selectionReason":  {
                                                                                                                                                "type":  "string",
                                                                                                                                                "minLength":  1
                                                                                                                                            }
                                                                                                                    }
                                                                                                 }
                                                                                   },
                                                         "risks":  {
                                                                       "type":  "array",
                                                                       "items":  {
                                                                                     "type":  "string",
                                                                                     "minLength":  1
                                                                                 }
                                                                   },
                                                         "likelyRepositoryAreas":  {
                                                                                       "type":  "array",
                                                                                       "minItems":  1,
                                                                                       "items":  {
                                                                                                     "type":  "string",
                                                                                                     "minLength":  1
                                                                                                 }
                                                                                   },
                                                         "planningPredicates":  {
                                                                                    "type":  "array",
                                                                                    "minItems":  1,
                                                                                    "maxItems":  20,
                                                                                    "items":  {
                                                                                                  "type":  "object",
                                                                                                  "additionalProperties":  false,
                                                                                                  "required":  [
                                                                                                                   "criterionId",
                                                                                                                   "scopeType",
                                                                                                                   "path",
                                                                                                                   "predicate",
                                                                                                                   "postcondition",
                                                                                                                   "region",
                                                                                                                   "selectionReason",
                                                                                                                   "maxBytes",
                                                                                                                   "maxPaths"
                                                                                                               ],
                                                                                                  "properties":  {
                                                                                                                     "criterionId": {"type": "string", "minLength": 1},
                                                                                                                     "scopeType":  {
                                                                                                                                       "enum":  [
                                                                                                                                                    "EXACT",
                                                                                                                                                    "PREFIX"
                                                                                                                                                ]
                                                                                                                                   },
                                                                                                                     "path":  {
                                                                                                                                  "type":  "string",
                                                                                                                                  "minLength":  1
                                                                                                                              },
                                                                                                                     "predicate":  {
                                                                                                                                       "type":  "object",
                                                                                                                                       "additionalProperties":  false,
                                                                                                                                       "required":  [
                                                                                                                                                        "kind",
                                                                                                                                                        "value"
                                                                                                                                                    ],
                                                                                                                                       "properties":  {
                                                                                                                                                          "kind":  {
                                                                                                                                                                       "enum":  [
                                                                                                                                                                                    "STATUS_EQUALS",
                                                                                                                                                                                    "TEXT_PRESENT",
                                                                                                                                                                                    "TEXT_ABSENT",
                                                                                                                                                                                    "UNSUPPORTED_SEMANTIC"
                                                                                                                                                                                ]
                                                                                                                                                                   },
                                                                                                                                                          "value":  {
                                                                                                                                                                        "type":  "string",
                                                                                                                                                                        "minLength":  1
                                                                                                                                                                    }
                                                                                                                                                      }
                                                                                                                                   },
                                                                                                                     "postcondition":  {
                                                                                                                                           "type":  "object",
                                                                                                                                           "additionalProperties":  false,
                                                                                                                                           "required":  [
                                                                                                                                                            "kind",
                                                                                                                                                            "value"
                                                                                                                                                        ],
                                                                                                                                           "properties":  {
                                                                                                                                                              "kind":  {
                                                                                                                                                                           "enum":  [
                                                                                                                                                                                        "STATUS_EQUALS",
                                                                                                                                                                                        "TEXT_PRESENT",
                                                                                                                                                                                        "TEXT_ABSENT",
                                                                                                                                                                                        "UNSUPPORTED_SEMANTIC"
                                                                                                                                                                                    ]
                                                                                                                                                                       },
                                                                                                                                                              "value":  {
                                                                                                                                                                            "type":  "string",
                                                                                                                                                                            "minLength":  1
                                                                                                                                                                        }
                                                                                                                                                          }
                                                                                                                                       },
                                                                                                                     "region":  {
                                                                                                                                    "anyOf":  [
                                                                                                                                                  {
                                                                                                                                                      "type":  "object",
                                                                                                                                                      "additionalProperties":  false,
                                                                                                                                                      "required":  [
                                                                                                                                                                       "kind",
                                                                                                                                                                       "name"
                                                                                                                                                                   ],
                                                                                                                                                      "properties":  {
                                                                                                                                                                         "kind":  {
                                                                                                                                                                                      "enum":  [
                                                                                                                                                                                                   "MARKDOWN_SECTION",
                                                                                                                                                                                                   "MARKDOWN_FENCE"
                                                                                                                                                                                               ]
                                                                                                                                                                                  },
                                                                                                                                                                         "name":  {
                                                                                                                                                                                      "type":  "string",
                                                                                                                                                                                      "minLength":  1
                                                                                                                                                                                  }
                                                                                                                                                                     }
                                                                                                                                                  },
                                                                                                                                                  {
                                                                                                                                                      "type":  "object",
                                                                                                                                                      "additionalProperties":  false,
                                                                                                                                                      "required":  [
                                                                                                                                                                       "kind",
                                                                                                                                                                       "name"
                                                                                                                                                                   ],
                                                                                                                                                      "properties":  {
                                                                                                                                                                         "kind":  {
                                                                                                                                                                                      "enum":  [
                                                                                                                                                                                                   "WHOLE_FILE"
                                                                                                                                                                                               ]
                                                                                                                                                                                  },
                                                                                                                                                                         "name":  {
                                                                                                                                                                                      "enum":  [
                                                                                                                                                                                                   "WHOLE_FILE"
                                                                                                                                                                                               ]
                                                                                                                                                                                  }
                                                                                                                                                                     }
                                                                                                                                                  },
                                                                                                                                                  {
                                                                                                                                                      "type":  "null"
                                                                                                                                                  }
                                                                                                                                              ]
                                                                                                                                },
                                                                                                                     "selectionReason":  {
                                                                                                                                             "type":  "string",
                                                                                                                                             "minLength":  1
                                                                                                                                         },
                                                                                                                     "maxBytes":  {
                                                                                                                                      "type":  "integer",
                                                                                                                                      "minimum":  1,
                                                                                                                                      "maximum":  262144
                                                                                                                                  },
                                                                                                                     "maxPaths":  {
                                                                                                                                      "type":  "integer",
                                                                                                                                      "minimum":  1,
                                                                                                                                      "maximum":  200
                                                                                                                                  }
                                                                                                                 }
                                                                                              }
                                                                                }
                                                     }
                                  }
             }
}
