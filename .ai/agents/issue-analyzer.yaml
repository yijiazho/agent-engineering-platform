{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Agent",
  "metadata": {"name": "issue-analyzer", "version": "1.3.0"},
  "spec": {
    "role": "Issue Analyzer",
    "promptRef": {"kind": "Prompt", "name": "issue-analysis", "version": "1.2.0"},
    "modelRef": {"kind": "Model", "name": "default-reasoning", "version": "1.1.0"},
    "policyRefs": [{"kind": "Policy", "name": "agent-safety", "version": "1.0.0"}],
    "outputSchema": {
      "type": "object", "additionalProperties": false,
      "required": ["requestedChange", "acceptanceCriteria", "acceptanceCriterionInsertions", "risks", "likelyRepositoryAreas", "planningPredicates"],
      "properties": {
        "requestedChange": {"type": "string", "minLength": 1},
        "acceptanceCriteria": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
        "acceptanceCriterionInsertions": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "object", "additionalProperties": false, "required": ["criterion", "requiredInsertions"], "properties": {"criterion": {"type": "string", "minLength": 1}, "requiredInsertions": {"type": "array", "uniqueItems": true, "items": {"type": "object", "additionalProperties": false, "required": ["path", "value"], "properties": {"path": {"type": "string", "minLength": 1}, "value": {"type": "string", "minLength": 1}}}}}}},
        "risks": {"type": "array", "items": {"type": "string", "minLength": 1}},
        "likelyRepositoryAreas": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
        "planningPredicates": {"type": "array", "minItems": 1, "maxItems": 20, "items": {"type": "object", "additionalProperties": false, "required": ["scopeType", "path", "predicate", "postcondition", "region", "selectionReason", "maxBytes", "maxPaths"], "properties": {"scopeType": {"enum": ["EXACT", "PREFIX"]}, "path": {"type": "string", "minLength": 1}, "predicate": {"type": "object", "additionalProperties": false, "required": ["kind", "value"], "properties": {"kind": {"enum": ["STATUS_EQUALS", "TEXT_PRESENT", "TEXT_ABSENT", "UNSUPPORTED_SEMANTIC"]}, "value": {"type": "string", "minLength": 1}}}, "postcondition": {"type": "object", "additionalProperties": false, "required": ["kind", "value"], "properties": {"kind": {"enum": ["STATUS_EQUALS", "TEXT_PRESENT", "TEXT_ABSENT", "UNSUPPORTED_SEMANTIC"]}, "value": {"type": "string", "minLength": 1}}}, "region": {"anyOf": [{"type": "object", "additionalProperties": false, "required": ["kind", "name"], "properties": {"kind": {"enum": ["MARKDOWN_SECTION", "MARKDOWN_FENCE"]}, "name": {"type": "string", "minLength": 1}}}, {"type": "null"}]}, "selectionReason": {"type": "string", "minLength": 1}, "maxBytes": {"type": "integer", "minimum": 1, "maximum": 262144}, "maxPaths": {"type": "integer", "minimum": 1, "maximum": 200}}}}
      }
    }
  }
}
