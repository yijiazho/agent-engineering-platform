{
  "apiVersion": "aep.dev/v1alpha1",
  "kind": "Agent",
  "metadata": {
    "name": "planner",
    "version": "1.14.0"
  },
  "spec": {
    "role": "Implementation Planner",
    "promptRef": {
      "kind": "Prompt",
      "name": "implementation-planning",
      "version": "1.13.0"
    },
    "modelRef": {
      "kind": "Model",
      "name": "default-reasoning",
      "version": "1.1.0"
    },
    "policyRefs": [
      {
        "kind": "Policy",
        "name": "agent-safety",
        "version": "1.0.0"
      }
    ],
    "outputSchema": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "intendedFiles",
        "deletionAuthorizedFiles",
        "noChangeFiles",
        "requiredInsertions",
        "unsupportedAcceptanceCriteria",
        "acceptanceCriteriaClassifications",
        "tests",
        "assumptions",
        "risks",
        "implementationSteps",
        "authorizedPaths",
        "requiredChangePaths",
        "verifiedNoChangePaths",
        "unsupportedPaths",
        "pathEvidence",
        "evaluatorEvidence"
      ],
      "properties": {
        "intendedFiles": {
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "deletionAuthorizedFiles": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "noChangeFiles": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "requiredInsertions": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "path",
              "value"
            ],
            "properties": {
              "path": {
                "type": "string",
                "minLength": 1
              },
              "value": {
                "type": "string",
                "minLength": 1
              }
            }
          }
        },
        "unsupportedAcceptanceCriteria": {
          "type": "array",
          "description": "Stable acceptance criterion IDs classified as UNSUPPORTED.",
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "acceptanceCriteriaClassifications": {
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "criterionId",
              "criterion",
              "classification",
              "requiredInsertions"
            ],
            "properties": {
              "criterionId": {
                "type": "string",
                "minLength": 1
              },
              "criterion": {
                "type": "string",
                "minLength": 1
              },
              "classification": {
                "enum": [
                  "REQUIRED_INSERTION",
                  "UNSUPPORTED",
                  "EVALUATOR_OWNED"
                ]
              },
              "requiredInsertions": {
                "type": "array",
                "uniqueItems": true,
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["path", "value"],
                  "properties": {
                    "path": {"type": "string", "minLength": 1},
                    "value": {"type": "string", "minLength": 1}
                  }
                }
              }
            }
          }
        },
        "tests": {
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "assumptions": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "risks": {
          "type": "array",
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "implementationSteps": {
          "type": "array",
          "minItems": 1,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "authorizedPaths": {
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "requiredChangePaths": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "verifiedNoChangePaths": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "unsupportedPaths": {
          "type": "array",
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "pathEvidence": {
          "type": "array",
          "minItems": 1,
          "uniqueItems": true,
          "items": {
            "type": "string",
            "minLength": 1
          }
        },
        "evaluatorEvidence": {
          "type": "array",
          "uniqueItems": true,
          "items": {"type": "string", "minLength": 1}
        }
      }
    }
  }
}
