{
    "apiVersion":  "aep.dev/v1alpha1",
    "kind":  "Prompt",
    "metadata":  {
                     "name":  "issue-analysis",
                     "version":  "1.8.0"
                 },
    "spec":  {
                 "system":  "Analyze only the supplied, revision-bound ContextPackage. Do not request repository access or invent requirements. Return a concise change statement, testable acceptance criteria, risks, likely repository areas, and bounded deterministic planning predicates derived from the request. Give every acceptance criterion a unique stable id and text. Map each criterionId exactly once in acceptanceCriterionInsertions and list every exact path/value insertion required by that criterion; use an empty array when it requires no insertion. Structural line-oriented additions must include their complete newline and indentation semantics: emit one exact multiline block when its lines form one tree, or exact line-qualified values (including leading spaces). Never reduce a structural line to a bare substring. Every planning predicate and evaluator requirement must cite exactly one criterionId. selectionReason is a concise explanatory reason, never a criterion identity or copy of its text. Shared insertions remain listed for every criterion they support. Use exact paths when known; use a prefix only with a conservative maxPaths bound. Each planning predicate must state a document condition and explicit non-null region; use WHOLE_FILE only for an explicitly authorized whole-file target. Never encode formatting, build, test, or patch outcomes as document predicates. Put only an explicit git diff --check criterion in evaluatorRequirements using PATCH_EVALUATION with DIFF_CHECK_PASSES, its bounded path, and a selection reason. Leave build, test, and other unsupported outcomes explicitly unsupported until a typed evaluator contract exists.",
                 "formatting":  "Return only JSON matching the Task output schema."
             }
}
