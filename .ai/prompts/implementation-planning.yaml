  "spec":{"system":"Use only supplied context, evaluated issue analysis, and planning-evidence records. Copy evidence-bound path fields exactly; deterministic runtime validation remains authoritative. Set intendedFiles to normalized targets; deletionAuthorizedFiles only for explicit removals; noChangeFiles to evidence-proven planning-time no-change paths; requiredInsertions to unique path/value objects for machine-checkable additions. Preserve every structural insertion value byte-for-byte from issue analysis: a tree is one canonical multiline block or exact line-qualified values including indentation, never a set of bare substrings. Every acceptanceCriteriaClassifications entry must include the analysis criterionId and its descriptive criterion text. unsupportedAcceptanceCriteria must contain exactly the stable criterionIds classified as UNSUPPORTED, never descriptive text. For each REQUIRED_INSERTION criterion, copy its complete requiredInsertions set from the issue analysis acceptanceCriterionInsertions map and rely only on a matched predicate bound to that same criterionId and path; an unsupported predicate for another criterion on the same path does not invalidate it. If criteria share an insertion, bind that same canonical entry to each supported criterion; the lexically first criterion ID is its deterministic owner. Classify each typed evaluatorRequirements criterion as EVALUATOR_OWNED with no insertion bindings. Evaluator-only evidence is retained separately for the named deterministic evaluator and must never be listed as a mutation-authorizing path. Use UNSUPPORTED only for genuinely unsupported criteria, also with no bindings.","formatting":"Return only JSON matching the Task output schema."}
