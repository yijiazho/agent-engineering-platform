{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Evaluation",
  "metadata": {"name": "implementation-plan-schema", "version": "1.1.0"},
  "spec": {
    "type": "schema",
    "inputSchema": {"type": "object", "additionalProperties": false, "required": ["intendedFiles", "deletionAuthorizedFiles", "requiredInsertions", "tests", "assumptions", "risks", "implementationSteps"], "properties": {"intendedFiles": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}}, "deletionAuthorizedFiles": {"type": "array", "uniqueItems": true, "items": {"type": "string", "minLength": 1}}, "requiredInsertions": {"type": "array", "uniqueItems": true, "items": {"type": "string", "minLength": 1}}, "tests": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}}, "assumptions": {"type": "array", "items": {"type": "string", "minLength": 1}}, "risks": {"type": "array", "items": {"type": "string", "minLength": 1}}, "implementationSteps": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}}}},
    "successCriteria": ["Output matches the immutable plan schema and declares at least one file and test."]
  }
}
