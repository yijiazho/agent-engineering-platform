{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Policy",
  "metadata": {"name": "publication-evidence", "version": "1.1.0"},
  "spec": {"type": "publication", "rules": [
    {"effect": "allow", "conditions": {"type": "object", "required": ["candidateAction", "evidence"], "properties": {"candidateAction": {"type": "object", "required": ["action"], "properties": {"action": {"const": "github.create_pr"}}}, "evidence": {"type": "object", "additionalProperties": false, "required": ["patchGenerated", "validationRan", "requiredArtifactsPresent", "requiredEvaluationsPresent", "allRequiredEvaluationsPassed", "noPriorPolicyViolation", "failures"], "properties": {"patchGenerated": {"const": true}, "validationRan": {"const": true}, "requiredArtifactsPresent": {"const": true}, "requiredEvaluationsPresent": {"const": true}, "allRequiredEvaluationsPassed": {"const": true}, "noPriorPolicyViolation": {"const": true}, "failures": {"type": "array", "maxItems": 0}}}}}, "reason": "All required revision-bound publication evidence is present and passing with no prior policy denial."}
  ]}
}
