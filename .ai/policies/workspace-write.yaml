{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Policy",
  "metadata": {"name": "workspace-write", "version": "1.0.0"},
  "spec": {"type": "pre-execution-capability", "rules": [
    {"effect": "allow", "capabilities": ["filesystem.write", "git.read"], "reason": "GeneratePatch may write only plan-selected paths and inspect the resulting diff."}
  ]}
}
