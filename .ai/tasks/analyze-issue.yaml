{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Task",
  "metadata": {"name": "analyze-issue", "version": "1.3.0"},
  "spec": {
    "objective": "Analyze the normalized issue and identify a bounded, testable repository change.",
    "agentRef": {"kind": "Agent", "name": "issue-analyzer", "version": "1.2.0"},
    "outputs": {
      "type": "object", "additionalProperties": false,
      "required": ["requestedChange", "acceptanceCriteria", "risks", "likelyRepositoryAreas", "planningPredicates"],
      "properties": {
        "requestedChange": {"type": "string", "minLength": 1},
        "acceptanceCriteria": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
        "risks": {"type": "array", "items": {"type": "string", "minLength": 1}},
        "likelyRepositoryAreas": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
        "planningPredicates": {"type": "array", "minItems": 1, "maxItems": 20, "items": {"type": "object", "additionalProperties": false, "required": ["scopeType", "path", "predicate", "postcondition", "selectionReason", "maxBytes", "maxPaths"], "properties": {"scopeType": {"enum": ["EXACT", "PREFIX"]}, "path": {"type": "string", "minLength": 1}, "predicate": {"type": "object", "additionalProperties": false, "required": ["kind", "value"], "properties": {"kind": {"enum": ["STATUS_EQUALS", "TEXT_PRESENT", "TEXT_ABSENT", "UNSUPPORTED_SEMANTIC"]}, "value": {"type": "string", "minLength": 1}}}, "postcondition": {"type": "object", "additionalProperties": false, "required": ["kind", "value"], "properties": {"kind": {"enum": ["STATUS_EQUALS", "TEXT_PRESENT", "TEXT_ABSENT", "UNSUPPORTED_SEMANTIC"]}, "value": {"type": "string", "minLength": 1}}}, "selectionReason": {"type": "string", "minLength": 1}, "maxBytes": {"type": "integer", "minimum": 1, "maximum": 262144}, "maxPaths": {"type": "integer", "minimum": 1, "maximum": 200}}}}
      }
    },
    "requiredContext": ["event", "issue", "candidate-files"],
    "optionalContext": ["repository-inventory", "documentation", "knowledge"],
    "inputContextTokenBudget": 32000,
    "knowledgeBases": [{"kind": "KnowledgeBase", "name": "aep-repository", "version": "1.1.0"}],
    "evaluations": [{"kind": "Evaluation", "name": "issue-analysis-schema", "version": "1.1.0"}]
  }
}
