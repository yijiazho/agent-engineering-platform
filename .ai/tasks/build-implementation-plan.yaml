{
  "apiVersion": "aep.dev/v1alpha1", "kind": "Task",
  "metadata": {"name": "build-implementation-plan", "version": "1.0.1"},
  "spec": {
    "objective": "Turn the evaluated issue analysis into an actionable, repository-scoped implementation plan.",
    "agentRef": {"kind": "Agent", "name": "planner", "version": "1.0.1"},
    "outputs": {
      "type": "object", "additionalProperties": false,
      "required": ["intendedFiles", "tests", "assumptions", "risks", "implementationSteps"],
      "properties": {
        "intendedFiles": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
        "tests": {"type": "array", "minItems": 1, "uniqueItems": true, "items": {"type": "string", "minLength": 1}},
        "assumptions": {"type": "array", "items": {"type": "string", "minLength": 1}},
        "risks": {"type": "array", "items": {"type": "string", "minLength": 1}},
        "implementationSteps": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}}
      }
    },
    "requiredContext": ["issue", "repository-inventory", "documentation", "candidate-files", "dependency-manifests", "test-hints", "knowledge", "prior-artifacts"],
    "knowledgeBases": [{"kind": "KnowledgeBase", "name": "aep-repository", "version": "1.0.0"}],
    "evaluations": [{"kind": "Evaluation", "name": "implementation-plan-schema", "version": "1.0.0"}]
  }
}
