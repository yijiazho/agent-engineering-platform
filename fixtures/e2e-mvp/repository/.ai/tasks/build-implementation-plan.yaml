apiVersion: aep.dev/v1alpha1
kind: Task
metadata:
  name: build-implementation-plan
  version: 1.0.0
spec:
  objective: Plan the fixture change.
  agentRef:
    kind: Agent
    name: planner
    version: 1.0.0
  requiredContext:
    - prior-artifacts
    - repository-inventory
    - planning-evidence
  inputContextTokenBudget: 32000
  planningEvidenceInspection:
    maxFileBytes: 262144
    maxTotalBytes: 1048576
    statusFieldScanBytes: 65536
  planningPredicates:
    - path: src/app.py
      selectionReason: Fixture value is ready for its deterministic update.
      region:
        kind: WHOLE_FILE
        name: WHOLE_FILE
      predicate:
        kind: TEXT_PRESENT
        value: value = 1
      postcondition:
        kind: TEXT_PRESENT
        value: value = 2
  evaluations:
    - kind: Evaluation
      name: plan-schema
      version: 1.0.0
  outputs:
    type: object
    additionalProperties: false
    required:
      - intendedFiles
      - tests
      - assumptions
      - risks
      - implementationSteps
      - acceptanceCriteriaClassifications
      - requiredInsertions
      - unsupportedAcceptanceCriteria
    properties:
      intendedFiles:
        type: array
        minItems: 1
        items:
          type: string
      tests:
        type: array
        minItems: 1
        items:
          type: string
      assumptions:
        type: array
        items:
          type: string
      risks:
        type: array
        items:
          type: string
      implementationSteps:
        type: array
        minItems: 1
        items:
          type: string
      acceptanceCriteriaClassifications:
        type: array
        minItems: 1
        items:
          type: object
      requiredInsertions:
        type: array
        items:
          type: object
      unsupportedAcceptanceCriteria:
        type: array
        items:
          type: string
      authorizedPaths:
        type: array
        items:
          type: string
      requiredChangePaths:
        type: array
        items:
          type: string
      verifiedNoChangePaths:
        type: array
        items:
          type: string
      unsupportedPaths:
        type: array
        items:
          type: string
      pathEvidence:
        type: array
        items:
          type: string
      evaluatorEvidence:
        type: array
        items:
          type: string
      noChangeFiles:
        type: array
        items:
          type: string
